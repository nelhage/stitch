name: Release

# Pushing a `v*` tag builds static binaries and publishes them as a GitHub
# release. The release is created as a draft, the binaries are uploaded to
# it, and it is published only once every build has succeeded, so users never
# see a partial release.
#
# Running the workflow by hand (workflow_dispatch) builds and checks the
# binaries without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Release binaries are built with a rustup toolchain, since nixpkgs' rustc
  # has no std for the musl targets, and links Darwin binaries against
  # libraries in /nix/store. To keep releases on the same compiler as CI and
  # local development, the version is taken from the flake.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      rust-version: ${{ steps.rust.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: rust
        name: Find the flake's rustc version
        run: |
          version=$(nix eval --raw --expr \
            '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.rustc.version')
          echo "rustc $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Releases are numbered 0.x.0 in Cargo.toml and tagged v0.x; the full
      # form (v0.x.0) is accepted too.
      - name: Check that the tag matches the crate version
        if: env.PUBLISH == 'true'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stitch") | .version')
          case "$TAG" in
            "v$version" | "v${version%.0}") ;;
            *)
              echo "::error::Tag $TAG does not match Cargo.toml version $version"
              exit 1
              ;;
          esac
      - name: Create draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent, so that a failed run can be re-run.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" --draft --verify-tag --generate-notes \
              --title "$TAG" "${prerelease[@]}"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TARGET: ${{ matrix.target }}
      RUST_VERSION: ${{ needs.prepare.outputs.rust-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup override set "$RUST_VERSION"
          rustc --version
      # Every runner builds natively, so the tests run against the binary
      # that ships. (The sshd e2e tests skip themselves, as no sshd is
      # installed; CI runs them.)
      - name: Test
        run: cargo test --locked --release --target "$TARGET"
      - name: Build
        run: cargo build --locked --release --target "$TARGET"
      - name: Check the binary
        run: |
          bin="target/$TARGET/release/stitch"
          file "$bin"
          "$bin" --version
          case "$TARGET" in
            *-linux-musl)
              # Must not depend on any shared library (in particular, libc).
              if readelf --dynamic "$bin" | grep -q NEEDED; then
                echo "::error::$bin is dynamically linked"
                readelf --dynamic "$bin"
                exit 1
              fi
              ;;
            *-apple-darwin)
              # Must depend only on system libraries, and carry the ad-hoc
              # signature that the linker adds; arm64 macOS refuses to run
              # unsigned code.
              otool -L "$bin"
              if otool -L "$bin" | tail -n +2 | grep -v -E '^\s+/(usr/lib|System/Library)/'; then
                echo "::error::$bin links a non-system library"
                exit 1
              fi
              codesign --verify --verbose "$bin"
              ;;
          esac
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/stitch-$TARGET.tar.gz" -C "target/$TARGET/release" stitch -C "$PWD" LICENSE
          tar -tzvf "dist/stitch-$TARGET.tar.gz"
          ls -l dist
      - name: Upload to release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/stitch-$TARGET.tar.gz" --clobber

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Add checksums
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --pattern 'stitch-*.tar.gz'
          sha256sum stitch-*.tar.gz | tee SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
      - name: Publish release
        run: gh release edit "$TAG" --draft=false
