[package]
name = "stitch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"] }
getrandom = "0.4.3"
log = "0.4.35"
nix = { version = "0.31.3", features = ["socket", "uio", "fs", "process", "signal", "user", "term"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "process", "macros", "signal", "sync"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[profile.release]
# Arithmetic overflow panics rather than wrapping, as in debug builds: in a
# protocol implementation, a wrapped sequence number, window or length
# would more likely corrupt a stream silently than fail.
overflow-checks = true
